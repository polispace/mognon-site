backend:
  name: git-gateway
  branch: main

media_folder: assets
public_folder: assets

locale: it

show_preview_links: false

collections:
  - name: content
    label: Contenuto sito
    files:
      - name: site
        label: Sito
        file: content.json
        fields:

          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: "ID Vimeo (sfondo)", name: video_id, widget: string, hint: "Solo il numero, es. 1135024751" }
              - { label: "Video in loop", name: video_loop, widget: boolean, default: true }
              - { label: "Immagine fallback", name: image, widget: image, hint: "Mostrata se il video non è disponibile" }
              - { label: "Titolo (una riga per linea)", name: title, widget: text }
              - { label: "Sottotitolo (una riga per linea)", name: subtitle, widget: text }

          - label: "Intro — Ciao!"
            name: intro
            widget: object
            fields:
              - { label: Paragrafo 1, name: paragraph1, widget: text }
              - { label: Paragrafo 2, name: paragraph2, widget: text }

          - label: Reel video
            name: reel
            widget: object
            fields:
              - { label: ID Vimeo, name: vimeo_id, widget: string, hint: "Solo il numero, es. 1135024751" }
              - { label: "Video in loop", name: video_loop, widget: boolean, default: false }
              - { label: "Immagine poster (anteprima)", name: poster, widget: image }

          - label: "Cosa Faccio — servizi"
            name: services
            widget: list
            label_singular: Servizio
            field:
              label: Voce
              name: item
              widget: string
            hint: "La voce che inizia con + diventa viola"

          - label: Gallery
            name: gallery
            widget: object
            fields:
              - { label: "Slideshow automatico", name: autoplay, widget: boolean, default: false }
              - label: Immagini
                name: images
                widget: list
                label_singular: Immagine
                field:
                  label: Immagine
                  name: image
                  widget: image

          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Nome, name: name, widget: string }
              - { label: Ruolo, name: role, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: LinkedIn URL, name: linkedin, widget: string }
              - { label: Città, name: location, widget: string }
