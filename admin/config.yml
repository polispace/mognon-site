backend:
  name: git-gateway
  branch: main

media_folder: assets
public_folder: assets

locale: it

show_preview_links: false

collections:
  - name: content
    label: Contenuto sito
    files:
      - name: site
        label: Sito
        file: content.json
        fields:

          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: "ID Vimeo (sfondo)", name: video_id, widget: string, hint: "Solo il numero, es. 1135024751" }
              - { label: "Video in loop", name: video_loop, widget: boolean, default: true }
              - { label: "Immagine fallback", name: image, widget: image, hint: "Mostrata se il video non è disponibile. Usa un'immagine leggera (max ~1920px, < ~1 MB)." }
              - { label: "Titolo (una riga per linea)", name: title, widget: text }
              - { label: "Sottotitolo (una riga per linea)", name: subtitle, widget: text }

          - label: "Intro — Ciao!"
            name: intro
            widget: object
            fields:
              - { label: Paragrafo 1, name: paragraph1, widget: text }
              - { label: Paragrafo 2, name: paragraph2, widget: text }

          - label: Reel video
            name: reel
            widget: object
            fields:
              - { label: ID Vimeo, name: vimeo_id, widget: string, hint: "Solo il numero, es. 1135024751" }
              - { label: "Partenza automatica (muto, senza tasto play)", name: autoplay, widget: boolean, default: true }
              - { label: "Video in loop", name: video_loop, widget: boolean, default: true }
              - { label: "Immagine poster (usata solo se partenza automatica è OFF)", name: poster, widget: image }

          - label: "Cosa Faccio — servizi"
            name: services
            widget: list
            label_singular: Servizio
            field:
              label: Voce
              name: item
              widget: string
            hint: "La voce che inizia con + diventa viola"

          - label: Gallery
            name: gallery
            widget: object
            fields:
              - { label: "Slideshow automatico", name: autoplay, widget: boolean, default: false }
              - label: Immagini
                name: images
                widget: list
                label_singular: Immagine
                hint: "⚠️ Immagini web leggere (lato lungo max ~1920px, sotto ~1 MB, meglio JPG). Il credito appare nella striscia gialla sotto, sincronizzato con la slide mostrata."
                fields:
                  - { label: Immagine, name: image, widget: image }
                  - { label: "Credito foto", name: credit, widget: string, default: "© Marco Mognon — AI-generated visuals", required: false, hint: "Mostrato nella striscia sotto la gallery quando questa immagine è visibile. Vuoto = striscia nascosta per questa slide." }

          - label: "Brand — loghi"
            name: brands
            widget: object
            fields:
              - { label: "Etichetta", name: label, widget: string, default: "Brand per cui ho lavorato" }
              - { label: "Immagine unica dei loghi (consigliato)", name: image, widget: image, required: false, hint: "Se carichi un'immagine qui (es. la griglia loghi fatta da te in Figma), SOSTITUISCE i loghi singoli sotto. È il modo più semplice e sicuro per gestire i loghi da solo." }
              - label: "Loghi singoli (avanzato)"
                name: logos
                widget: list
                label_singular: Logo
                required: false
                hint: "Usato solo se NON carichi l'immagine unica sopra. Vengono resi bianchi e allineati: funziona bene solo con SVG monocromatici a sfondo trasparente. Loghi colorati, con sfondo o emblemi col testo in negativo possono venire male."
                field: { label: Logo, name: logo, widget: image, media_folder: "/assets/logos", public_folder: "/assets/logos" }

          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Nome, name: name, widget: string }
              - { label: Ruolo, name: role, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: LinkedIn URL, name: linkedin, widget: string }
              - { label: Città, name: location, widget: string }
